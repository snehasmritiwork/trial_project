<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Anniversary Page</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #faf0f2;
      color: #333;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
    }
    .card {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border: 1px solid #f0d6dc;
    }
    h1 { color: #d65a75; font-size: 2em; margin-bottom: 5px; }
    p { font-size: 1.1em; line-height: 1.6; color: #555; }
    .heart { font-size: 30px; margin: 15px 0; }
    .btn {
      background-color: #d65a75;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1em;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s ease;
    }
    .btn:hover { background-color: #b8435d; }
    #secret-note {
      display: none;
      margin-top: 25px;
      padding: 15px;
      background-color: #fff5f7;
      border-radius: 10px;
      border-left: 4px solid #d65a75;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Practice Anniversary Page</h1>
    <p>3 Years Together • Distance Means Nothing</p>
    <div class="heart">❤️</div>
    <p>If you're seeing this page online, your website is officially live!</p>

    <button class="btn" onclick="revealNote()">Click to Open Note</button>

    <div id="secret-note">
      <p>"Practice complete! Next step: customize this with your real photos, memories, and letters."</p>
    </div>
  </div>

  <script>
    function revealNote() {
      var note = document.getElementById("secret-note");
      if (note.style.display === "block") {
        note.style.display = "none";
      } else {
        note.style.display = "block";
      }
    }
  </script>

</body>
</html>
